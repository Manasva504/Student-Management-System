<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Management System</title>
    <meta
      name="description"
      content="Full-stack student management system — React and Redux frontend, Express and MongoDB API with Redis caching, JWT auth with role-based access control, and Socket.IO real-time updates."
    />

    <!-- OpenGraph: LinkedIn, WhatsApp, Slack, Facebook preview cards.
         og:url and og:image must be absolute URLs — relative paths are
         ignored by every major scraper. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Student Management System" />
    <meta property="og:title" content="Student Management System" />
    <meta
      property="og:description"
      content="Full-stack student management system — React and Redux frontend, Express and MongoDB API with Redis caching, JWT auth with role-based access control, and Socket.IO real-time updates."
    />
    <meta
      property="og:url"
      content="https://student-management-system-ivory-phi.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://student-management-system-ivory-phi.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Student Management System dashboard showing student analytics"
    />

    <!-- Twitter/X. summary_large_image gives the full-width card; it falls
         back to og:* for title/description/image. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Student Management System" />
    <meta
      name="twitter:description"
      content="Full-stack student management system — React and Redux frontend, Express and MongoDB API with Redis caching, JWT auth with role-based access control, and Socket.IO real-time updates."
    />
    <meta
      name="twitter:image"
      content="https://student-management-system-ivory-phi.vercel.app/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
