volumes:
  mongo-data:
services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./student-management-backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    env_file: 
      ./student-management-backend/.env

  frontend:
    build: .
    container_name: frontend
    ports:
      - "8081:80"
    depends_on:
      - backend